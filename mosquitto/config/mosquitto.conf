# Development default — anonymous allowed for easy simulator use.
# For production auth, use mosquitto.conf.prod

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

max_keepalive 120
max_connections 500
