name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  anomaly-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/anomaly-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python tests/test_cusum.py

  broker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/telemetry-broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
